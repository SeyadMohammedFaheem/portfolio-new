    <!-- Inline Critical Above-the-Fold CSS -->
    <style id="critical-css">
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/assets/fonts/inter/inter-normal-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('/assets/fonts/inter/inter-normal-500.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/assets/fonts/inter/inter-normal-700.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 800;
        font-display: swap;
        src: url('/assets/fonts/inter/inter-normal-800.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 900;
        font-display: swap;
        src: url('/assets/fonts/inter/inter-normal-900.woff2') format('woff2');
      }

      :root {
        --bg-color: #0a0a0a;
        --text-color: #f5f5f5;
        --accent-color: #ff4d12;
        --font-main: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --transition-slow: 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: var(--font-main);
        overflow-x: hidden;
        width: 100%;
      }
      body {
        line-height: 1.2;
        -webkit-font-smoothing: antialiased;
      }
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10000;
      }
      #loading.fade-out {
        pointer-events: none;
        visibility: hidden;
        transition: visibility 2s;
      }
      .shutter {
        position: absolute;
        left: 0;
        width: 100%;
        height: 50.5%;
        background-color: var(--accent-color);
        transition: transform 1.5s cubic-bezier(0.85, 0, 0.15, 1);
        z-index: 10;
      }
      .shutter.top { top: 0; }
      .shutter.bottom { bottom: 0; }
      .fade-out .shutter.top { transform: translateY(-100%); }
      .fade-out .shutter.bottom { transform: translateY(100%); }
      .loader-hud-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        padding: 3.5rem;
        z-index: 20;
        color: #111;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: opacity 1s ease-out;
      }
      .fade-out .loader-hud-screen { opacity: 0; }
      .hud-label {
        position: absolute;
        font-size: 0.7rem;
        font-weight: 900;
        letter-spacing: 0.2em;
        opacity: 0.4;
        text-transform: uppercase;
      }
      .hud-label.tl { top: 3.5rem; left: 3.5rem; }
      .hud-label.tr { top: 3.5rem; right: 3.5rem; }
      .hud-label.bl { bottom: 3.5rem; left: 3.5rem; }
      .hud-label.br { bottom: 3.5rem; right: 3.5rem; }
      .hud-main-center { text-align: center; width: 100%; max-width: 1000px; }
      .brand-name-reveal {
        font-size: clamp(5rem, 18vw, 15rem);
        font-weight: 950;
        letter-spacing: -0.06em;
        line-height: 0.8;
        margin-bottom: 4rem;
      }
      .progress-container-linear {
        width: 250px;
        height: 2px;
        background: rgba(0, 0, 0, 0.1);
        margin: 0 auto 3rem;
        position: relative;
        overflow: hidden;
      }
      .progress-bar-fill {
        height: 100%;
        background: #111;
        transition: width 0.1s linear;
      }
      header.main-header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        padding: 2.5rem 3rem;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        z-index: 100;
      }
      .header-logo {
        font-size: 1.2rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: -0.02em;
        color: var(--text-color);
        text-decoration: none;
        z-index: 110;
      }
      .hero {
        height: 100vh;
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 3rem;
        position: relative;
        overflow: hidden;
      }
      .hero-bg-image {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
        opacity: 0.4;
      }
      .hero-bg-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: brightness(0.8) contrast(1.2);
      }
      .hero-main-title {
        font-size: clamp(4rem, 15vw, 18rem);
        font-weight: 900;
        line-height: 0.85;
        text-transform: uppercase;
        letter-spacing: -0.04em;
        margin-bottom: 2rem;
        position: relative;
        z-index: 10;
      }
      .canvas-container, .canvas-placeholder {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        z-index: -1;
        pointer-events: none;
      }
    </style>

  </head>
